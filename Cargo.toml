[package]
name = "plugin-launcher"
version = "0.5.9"
edition = "2024"
license = "MIT OR Apache-2.0"

[[bin]]
name = "plugin-launcher"
path = "src/main.rs"
test = false # the embedded manifest demands admin: a test exe could not start from a normal shell

[[test]]
name = "install-selection"
path = "src/selection.rs"

[[test]]
name = "update-manifest"
path = "src/update/manifest.rs"
[[test]]
name = "update-swap"
path = "src/update/swap.rs"

[dependencies]
winrust-common = { path = "common" }
ed25519-dalek = "2.1.1" # signed update manifests (src/update)
sha2 = "0.10.8"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Graphics_GdiPlus", "Win32_Security", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_RemoteDesktop", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
embed-resource = "3"

# One workspace: one Cargo.lock, one target\ (every exe lands in target\release), shared dependencies are built once.
[workspace]
members = [
    "common",
    "ReShell",
    "plugins/topbar",
    "plugins/rtaskmgr-win32",
    "plugins/rs-du",
    "plugins/rust-explorer",
    "plugins/rs-shell",
    "plugins/wiztree",
    "plugins/photoview",
    "plugins/debloat",
    "plugins/purge",
    "plugins/rust-settings",
    "tools/winrust-sign",
]
# Stay separate projects with their own target\ and Cargo.lock, because they need panic = "unwind" (the profile below is
# shared by every member): rust-search's service threads must not take the process down, chrome-rs catches panics per page.
exclude = ["plugins/rust-search", "plugins/chrome-rs"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.release.package.rs-du]
opt-level = 3 # MFT parsing: speed over size, as before the workspace

[[test]]
name = "explorer-service-settings"
path = "src/install/explorer/dword_snapshot.rs"
